title: "Propose an idea"
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome you want, not the feature you imagine. An idea
        that can be measured is easier to accept than an idea that lists
        features.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or wrong today, and who it affects.
      placeholder: |
        The repeated part of a context pack is re-expanded by hand for every
        handoff, and the repetition is not observable in the ledger.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: The outcome you want
      description: |
        What should be observable once the idea is implemented. Say how you
        would check it.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you have already tried
      description: The workarounds, scripts, or experiments you already used.
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: Which layer it touches
      options:
        - Core ledger
        - Context expansion
        - Execution DAG
        - Sandbox
        - Hardware routing
        - GitHub sync
        - Dashboard preview
        - Command line interface
        - Documentation
        - Build and release
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and discussions for this idea.
          required: true
        - label: I did not include credentials, secrets, or private ticket data in this post.
          required: true
        - label: The idea keeps eligibility, authorization, execution, and acceptance as separate steps.
          required: true
