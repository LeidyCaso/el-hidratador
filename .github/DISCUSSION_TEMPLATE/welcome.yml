title: "Introduce yourself"
body:
  - type: markdown
    attributes:
      value: |
        Say hello. Pick the discussion category that fits your introduction
        best when you post it.

  - type: textarea
    id: who
    attributes:
      label: Who you are
      description: A short introduction. Name, role, and what you work with.
      placeholder: |
        I maintain a small platform team. I write Go and Python, and I spend
        most of my time on build and release tooling.
    validations:
      required: true

  - type: textarea
    id: building
    attributes:
      label: What you are building with the factory
      description: |
        The tool, the pipeline, or the workflow you are putting together.
        Describe the outcome, not the stack.
      placeholder: |
        I hydrate tickets from a Markdown board into reviewable execution
        state, and I want the acceptance gate to stay visible to the reviewer.
    validations:
      required: false

  - type: textarea
    id: help
    attributes:
      label: What you would like help with
      description: |
        The question, the blocker, or the feedback you are looking for.
      placeholder: |
        I am not sure whether the byte budget applies to the attached
        context only, or to the whole packet.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I did not include credentials, secrets, or private ticket data in this post.
          required: true
        - label: I did not paste a transcript, an account detail, or an internal hostname.
          required: true
