name: Small task
description: Pick up a well-scoped piece of work.
title: "[Small]: "
labels: ["good first issue", "help wanted", "size/S", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A small task is scoped to one area of the codebase and has a clear
        definition of done. Claim the task before you start, and say which
        resource scope key it owns.

  - type: textarea
    id: build
    attributes:
      label: What you would build
      description: The outcome you would deliver, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: What "done" looks like
      description: The observable result that tells you the task is finished.
      placeholder: |
        The command prints the omitted sections with their reasons, and the
        exit code is unchanged.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: The files or commands involved
      description: The modules, tests, or commands you expect to touch.
      placeholder: |
        `el_hidratador/context_expander.py` and
        `tests/test_context_expander.py`.
    validations:
      required: false

  - type: textarea
    id: verify
    attributes:
      label: How you would verify it
      description: The test or command that proves the change works.
      placeholder: |
        `python3 -m unittest discover -s tests -v`
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The change is scoped to one area of the codebase.
          required: true
        - label: I did not include credentials, secrets, or private ticket data in this proposal.
          required: true
