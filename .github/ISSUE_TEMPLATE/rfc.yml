name: Request for comments
description: Propose a change to the contract or the architecture before writing code.
title: "[RFC]: "
labels: ["rfc", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        An RFC asks for comments on a contract or an architecture change
        before any code is written. The house rule is that eligibility is not
        authorization, execution is not acceptance, and declared is not
        measured. A proposal that keeps those apart is easier to accept.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or wrong today, and who it affects.
      placeholder: |
        A handoff is prepared state, but nothing in the output says which
        part of it was measured and which part was declared.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: The change you propose, in terms of observable behaviour.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: The contract or guarantee it changes
      description: |
        State which contract changes: the output format, the ledger schema,
        the byte budget, the acceptance gate, or the adapter declarations.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including leaving the behaviour unchanged.
    validations:
      required: false

  - type: textarea
    id: unchanged
    attributes:
      label: What stays the same
      description: |
        Name the guarantees that survive the change. Eligibility is not
        authorization, execution is not acceptance, and declared is not
        measured.
    validations:
      required: false

  - type: textarea
    id: migration
    attributes:
      label: Migration and rollback
      description: |
        How existing ledgers, packets, or callers move to the new contract,
        and how the change is rolled back if it does not hold.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues, RFCs, and discussions for this change.
          required: true
        - label: I did not include credentials, secrets, or private ticket data in this proposal.
          required: true
        - label: The proposal keeps eligibility, authorization, execution, and acceptance as separate steps.
          required: true
