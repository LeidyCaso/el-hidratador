name: Attest

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to attest (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: attest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    name: attest the release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir dist --clobber
          ls -l dist

      - name: Attest the distribution
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The action accepts a glob or a list of paths in one input.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          push-to-registry: false

      - name: Generate an SBOM for the distribution
        # The action uploads the SBOM as a workflow artifact under the name
        # given here, so there is no second upload step to conflict with it.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ inputs.tag }}
          upload-artifact: true
