name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build (defaults to the current ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, verify, and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image for verification
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # The local docker exporter cannot carry a manifest list, so the
          # provenance and the SBOM are attached by the publishing build.
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}

      - name: Verify the image before it is published
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}"
          docker run --rm "$image" --version
          docker run --rm "$image" --help

      - name: Publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true
