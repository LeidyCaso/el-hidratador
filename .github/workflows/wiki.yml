name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.workflow }}-${{ github.ref }}
  # Two publishes of the same wiki would race each other.
  cancel-in-progress: false

jobs:
  publish:
    name: publish the wiki pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the wiki SSH key
        # The wiki is a separate git repository, and the workflow token does
        # not reach it. The deploy key needs write access to the wiki. When
        # the secret is absent the job reports that the wiki is not set up.
        env:
          WIKI_SSH_KEY: ${{ secrets.WIKI_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_SSH_KEY}" ]; then
            echo "no wiki SSH key is configured" >&2
            exit 0
          fi
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${WIKI_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          curl -fsSL https://api.github.com/meta -o "${RUNNER_TEMP}/github-meta.json"
          ssh-keyscan -t ed25519 github.com > "${RUNNER_TEMP}/github-hostkey" 2>/dev/null
          python3 - "${RUNNER_TEMP}/github-meta.json" "${RUNNER_TEMP}/github-hostkey" "${HOME}/.ssh/known_hosts" <<'PY'
          import base64
          import hashlib
          import json
          import sys

          meta = json.load(open(sys.argv[1], encoding="utf-8"))
          published = meta["ssh_key_fingerprints"]
          for line in open(sys.argv[2], encoding="utf-8"):
              parts = line.split()
              if len(parts) < 3:
                  continue
              digest = hashlib.sha256(base64.b64decode(parts[1])).digest()
              fingerprint = "SHA256:" + base64.b64encode(digest).decode().rstrip("=")
              if fingerprint in published:
                  with open(sys.argv[3], "w", encoding="utf-8") as handle:
                      handle.write(line)
                  break
          else:
              raise SystemExit("the GitHub host key does not match the published fingerprint")
          PY

      - name: Check whether the wiki repository exists
        id: wiki
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git ls-remote "git@github.com:${REPOSITORY}.wiki.git" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            {
              echo "## The wiki repository does not exist yet"
              echo
              echo "GitHub creates the wiki git repository the first time a page is added"
              echo "from the web interface:"
              echo
              echo "https://github.com/${REPOSITORY}/wiki/_new"
              echo
              echo "Create the \"Home\" page there, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the wiki pages
        # The helper clones the wiki, copies docs/wiki over it, and skips the
        # push when nothing changed.
        if: ${{ steps.wiki.outputs.exists == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/publish_wiki.sh "${REPOSITORY}"

      - name: Write the publish summary
        if: ${{ steps.wiki.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "## Wiki"
            echo
            echo "The pages in \`docs/wiki\` were published to the repository wiki."
          } >> "$GITHUB_STEP_SUMMARY"
